services:
  - type: web
    name: private-character-chat
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: APP_PASSWORD
        generateValue: true
      - key: APP_USERNAME
        value: owner
      - key: MODEL_API_KEY
        sync: false
      - key: MODEL_BASE_URL
        sync: false
      - key: MODEL_MODEL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: APP_ENCRYPTION_KEY
        sync: false
      - key: RUN_MAINTENANCE_WORKER
        value: "true"
      - key: RUN_ROLE_SCHEDULER
        value: "true"
      - key: ROLE_CRON_TOKEN
        generateValue: true
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        value: mailto:admin@example.com
