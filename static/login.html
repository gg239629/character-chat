<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登录 · 会话</title><link rel="stylesheet" href="/static/auth.css"></head>
<body class="auth-page"><main class="auth-card">
<h1>会话</h1><p class="auth-intro">登录后，继续你的故事。</p>
<div class="auth-tabs" role="tablist" aria-label="账号操作"><button id="loginTab" type="button" role="tab" aria-selected="true" aria-controls="authForm">登录</button><button id="registerTab" type="button" role="tab" aria-selected="false" aria-controls="authForm" tabindex="-1">注册</button></div>
<form id="authForm" role="tabpanel" aria-labelledby="loginTab">
<label for="username">用户名</label><input id="username" name="username" autocomplete="username" minlength="3" maxlength="40" pattern="[a-zA-Z0-9_\-]{3,40}" required placeholder="3–40位字母、数字、下划线或短横线">
<label for="password">密码</label><div class="password-field"><input id="password" name="password" type="password" autocomplete="current-password" maxlength="128" required><button id="showPassword" type="button" aria-label="显示密码" aria-pressed="false">显示</button></div>
<div id="registerFields" hidden><label for="confirmPassword">确认密码</label><input id="confirmPassword" type="password" autocomplete="new-password" maxlength="128"><div id="inviteField"><label for="inviteCode">邀请码</label><input id="inviteCode" autocomplete="off" maxlength="256"></div><p class="auth-help">密码至少10位。邀请码请向网站管理员获取。</p></div>
<p id="authStatus" role="status" aria-live="polite"></p><button id="authSubmit" class="auth-primary" type="submit" disabled>登录</button>
<p class="auth-help" id="recoveryHelp">忘记密码？请联系网站管理员重置。</p>
</form></main><script src="/static/login.js"></script></body></html>
