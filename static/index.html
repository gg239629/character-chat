<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>陪伴角色 · 网页版</title>
<style>
  :root{
    --bg:#101116; --panel:#181a22; --line:#272b38; --text:#e9e9f0; --dim:#868aa0;
    --me:#3a6df0;
    --wan1:#f2a0b6; --wan2:#c25d7f;
    --yan1:#f6c9a0; --yan2:#c98a52;
    --liu1:#a9b8d6; --liu2:#5f6f9a;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:var(--bg); color:var(--text);
    font:15px/1.7 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
    display:flex; flex-direction:column; height:100dvh;
  }

  header{
    display:flex; align-items:center; gap:10px;
    padding:10px 14px; background:var(--panel); border-bottom:1px solid var(--line);
    flex:0 0 auto;
  }
  header button{
    background:#232735;border:1px solid var(--line);color:var(--text);
    border-radius:8px;padding:6px 10px;font-size:13px;cursor:pointer;
  }
  header button:hover{background:#2b3040}
  header #save{margin-left:auto}

  #chat{flex:1 1 auto; overflow-y:auto; padding:18px 14px 8px}
  .group{margin:0 0 16px}
  .msg{display:flex; gap:10px; margin:0 0 10px; align-items:flex-start}
  .msg.me{flex-direction:row-reverse}
  .avatar{
    width:38px;height:38px;border-radius:50%;flex:0 0 auto;
    display:flex;align-items:center;justify-content:center;
    font-size:15px;font-weight:600;color:#16181f;
    box-shadow:0 0 0 1px rgba(255,255,255,.08);
    user-select:none;
  }
  .avatar.wan{background:linear-gradient(140deg,var(--wan1),var(--wan2))}
  .avatar.yan{background:linear-gradient(140deg,var(--yan1),var(--yan2))}
  .avatar.liu{background:linear-gradient(140deg,var(--liu1),var(--liu2))}
  .avatar.me{background:#2f3444;color:#cfd4e6}
  .body{max-width:min(700px,80%); display:flex; flex-direction:column}
  .msg.me .body{align-items:flex-end}
  .name{font-size:11px;color:var(--dim);margin:0 0 3px 4px;letter-spacing:.5px}
  .bubble{
    padding:10px 14px; border-radius:14px; white-space:pre-wrap; word-break:break-word;
    background:#22252f; border-top-left-radius:4px;
  }
  .msg.me .bubble{background:var(--me); border-top-left-radius:14px; border-top-right-radius:4px}
  .bubble.err{background:#3a1f26;color:#ff9db0;border:1px solid #6b2b3a}
  .cursor::after{content:"▍";color:var(--dim);animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}

  #composer{flex:0 0 auto; padding:10px 14px 14px; background:var(--panel); border-top:1px solid var(--line)}
  #composer .box{display:flex; gap:8px; align-items:flex-end}
  textarea{
    flex:1; resize:none; min-height:46px; max-height:180px;
    background:#0e0f15; color:var(--text); border:1px solid var(--line);
    border-radius:12px; padding:12px 14px; font:inherit; outline:none;
  }
  textarea:focus{border-color:#3a4a7a}
  #send{
    background:var(--me); color:#fff; border:0; border-radius:12px;
    padding:12px 20px; font-size:15px; cursor:pointer; min-width:76px;
  }
  #send:disabled{opacity:.5;cursor:default}
  #describe{
    background:#2b3040; color:#cfd6ea; border:1px solid var(--line);
    border-radius:12px; padding:12px 14px; font-size:14px; cursor:pointer;
  }
  #describe:hover{background:#343a4d}
  #describe:disabled{opacity:.5;cursor:default}
  #suggest{display:flex; flex-direction:column; gap:6px; margin:0 0 8px}
  #suggest:empty{display:none}
  .chip{
    text-align:left; background:#1e212b; border:1px solid #313749; color:#c9d0e4;
    border-radius:10px; padding:8px 12px; font:inherit; font-size:13px; line-height:1.6;
    cursor:pointer;
  }
  .chip:hover{background:#262b38; border-color:#44506e}
  .chip .tag{color:var(--dim); margin-right:6px; font-size:12px}

  #toast{
    position:fixed; left:50%; bottom:96px; transform:translate(-50%, 12px);
    max-width:min(560px,88vw); padding:10px 16px; border-radius:10px;
    font-size:13px; line-height:1.5; white-space:pre-wrap;
    background:#232734; color:#dfe3f0; border:1px solid #333a4d;
    opacity:0; pointer-events:none; transition:opacity .18s, transform .18s;
    z-index:50;
  }
  #toast.show{opacity:1; transform:translate(-50%, 0)}
  #toast.ok{background:#1d3a2a; border-color:#2f6b4a; color:#a8ecc4}
  #toast.warn{background:#3a3520; border-color:#6b5c2b; color:#f0dfa8}
  #toast.error{background:#3a1f26; border-color:#6b2b3a; color:#ffb0be}
  .hint{color:var(--dim);font-size:11px;margin-top:6px;display:flex;gap:12px}

  #settingsDlg{
    border:1px solid #333a4d; border-radius:14px; padding:20px 22px;
    background:#181a22; color:var(--text); width:min(520px,92vw);
  }
  #settingsDlg::backdrop{background:rgba(0,0,0,.55)}
  #settingsDlg h2{margin:0 0 14px; font-size:16px; font-weight:600}
  #settingsDlg .field{display:flex; flex-direction:column; gap:5px; margin:0 0 12px}
  #settingsDlg label{font-size:12px; color:var(--dim)}
  #settingsDlg input{
    background:#0e0f15; color:var(--text); border:1px solid var(--line);
    border-radius:9px; padding:9px 11px; font:inherit; font-size:13px; outline:none;
  }
  #settingsDlg input:focus{border-color:#3a4a7a}
  #settingsDlg .row2{display:flex; gap:12px}
  #settingsDlg .row2 .field{flex:1}
  #settingsDlg .eff{font-size:11px; color:var(--dim); line-height:1.6; margin:0 0 14px; white-space:pre-wrap}
  #settingsDlg .dlgFoot{display:flex; gap:8px; justify-content:flex-end}
  #settingsDlg .ghost{background:#232735;border:1px solid var(--line);color:var(--text);border-radius:9px;padding:8px 14px;font-size:13px;cursor:pointer}
  #settingsDlg .primary{background:var(--me);border:0;color:#fff;border-radius:9px;padding:8px 18px;font-size:13px;cursor:pointer}
  #settingsDlg .ghost:hover{background:#2b3040}
  .hintInline{color:#6b7286; margin-left:6px}
  #settingsDlg .status{font-size:12px; line-height:1.6; white-space:pre-wrap; margin:0 0 12px; min-height:0}
  #settingsDlg .status.ok{color:#a8ecc4}
  #settingsDlg .status.err{color:#ffb0be}
  #settingsDlg .status.wait{color:#c9b98a}
  .modelChip{
    font-size:12px; color:#9fb0d8; background:#1b1f2b; border:1px solid #2b3242;
    padding:3px 9px; border-radius:999px; white-space:nowrap; max-width:260px;
    overflow:hidden; text-overflow:ellipsis;
  }
  .modelChip.live{color:#a8ecc4; border-color:#2f6b4a}

  :root{--bg:#121c24;--panel:#1a2833;--line:#334550;--text:#edf2f4;--dim:#a8b8c2;--me:#346a73}
  body{background:radial-gradient(ellipse at 50% 0,#233843 0,transparent 65%),var(--bg);overflow:hidden;font-size:15px;line-height:1.8}
  button,input,textarea{-webkit-tap-highlight-color:transparent}
  button{font-family:inherit;transition:background .16s,border-color .16s;min-height:44px}
  button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid #98d6cb;outline-offset:3px}
  header{padding:18px max(24px,calc((100vw - 980px)/2));gap:20px;background:rgba(18,28,36,.9);border-color:#2b3d47}
  .brand{display:flex;gap:12px;align-items:center;flex:1;min-width:0}
  .brand-mark{display:grid;place-items:center;width:43px;height:43px;border:1px solid #597b7e;border-radius:15px 15px 15px 4px;color:#b9e1d5;font-family:KaiTi,STKaiti,serif;font-size:23px;background:#243d43}
  .brand h1{margin:0;font:500 21px/1.3 KaiTi,STKaiti,"Microsoft YaHei",serif;letter-spacing:2px}
  .brand p{margin:4px 0 0;font-size:11px;color:var(--dim);letter-spacing:1px}
  #settingsBtn{display:flex;align-items:center;justify-content:center;gap:9px;background:transparent;border:1px solid #425763;border-radius:14px;padding:8px 15px}
  #settingsBtn:hover{background:#2a3c48}
  #chat{min-height:0;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:#45606d transparent;padding:30px max(24px,calc((100vw - 900px)/2)) 24px;scroll-behavior:smooth}

  .group{margin-bottom:22px}.msg{gap:12px;margin-bottom:14px}
  .avatar{width:36px;height:36px;font-size:14px;box-shadow:none}.avatar.me{background:#344a55;color:#d3e1e5}
  .body{max-width:min(620px,84%);min-width:0}.name{color:#afc1ca;font-size:11px;margin-bottom:5px}
  .bubble{background:#233540;border:1px solid #344b57;padding:13px 17px;border-radius:4px 18px 18px 18px;line-height:1.95;box-shadow:0 3px 12px #07101720}
  .msg.me .bubble{background:#305a64;border-color:#426f77;border-radius:18px 4px 18px 18px}
  #composer{background:linear-gradient(transparent,#121c24 24%);border:0;padding:16px max(24px,calc((100vw - 900px)/2)) max(20px,env(safe-area-inset-bottom))}
  #composer .box{background:#1d303b;border:1px solid #49616d;border-radius:20px;padding:8px;gap:8px;box-shadow:0 8px 30px #070f1830}
  #input{border:0;background:transparent;border-radius:12px;min-width:0;padding:10px;min-height:48px;max-height:160px}
  #input::placeholder{color:#9dafb9}#input:focus{outline:0}
  #composer .box:focus-within{border-color:#8ec6bc;box-shadow:0 0 0 2px #8ec6bc18}
  #send{background:#a7d5c6;color:#163a36;min-width:70px;font-weight:600;padding:11px 16px;border-radius:13px}
  #send:hover{background:#c0e6d9}#describe{background:transparent;border-color:#4a6470;color:#cad9e1;padding:10px 13px;border-radius:13px}
  .hint{justify-content:space-between;padding:0 8px;font-size:11px;color:#a0b3be}
  .chip{background:#233843;border-color:#45606b;color:#e0eaee;border-radius:13px}
  #settingsDlg{width:min(560px,calc(100vw - 32px));max-height:calc(100dvh - 40px);overflow-y:auto;padding:28px;border-color:#49606d;background:#1a2833;border-radius:23px;box-shadow:0 24px 90px #0007;scrollbar-width:thin}
  #settingsDlg::backdrop{background:#071018b3;backdrop-filter:blur(6px)}
  #settingsDlg h2{font-size:23px;margin-bottom:22px}#settingsDlg h3{font-size:14px;margin:0}
  .section-caption{font-size:13px;margin:0 0 10px;color:#d5e3e9}.section-heading{display:flex;align-items:center;justify-content:space-between;gap:12px;border-top:1px solid var(--line);padding-top:20px;margin:20px 0 16px}
  .memory-actions{display:flex;gap:10px;flex-wrap:wrap}.settings-note{color:var(--dim);font-size:11px;margin:10px 0}
  #settingsDlg .ghost{background:#263b47;border-color:#405a68;border-radius:11px}#settingsDlg .danger{color:#f2b7b0}
  #settingsDlg .primary{background:#a7d5c6;color:#163a36;border-radius:11px;font-weight:600}
  #settingsDlg input{background:#13232d;border-color:#3f5663;padding:11px 12px;border-radius:11px;width:100%;min-width:0;font-size:14px}
  #settingsDlg label{color:#bdcbd2}#settingsDlg .field{margin-bottom:15px}#settingsDlg .row2 .field{min-width:0}
  #settingsDlg .eff{background:#15232c;border-radius:11px;padding:12px;overflow-wrap:anywhere}.modelChip{max-width:210px;background:#223b43;color:#c0d9dc;border-color:#47626b}
  #settingsDlg .dlgFoot{position:sticky;bottom:-28px;background:#1a2833;padding:14px 0 3px;gap:8px;flex-wrap:wrap}
  @media(max-width:600px){header{padding:12px 16px;padding-top:max(12px,env(safe-area-inset-top))}.brand h1{font-size:19px}.brand p{font-size:10px}#settingsBtn{padding:8px 11px}#chat{padding:20px 12px 12px}.avatar{width:30px;height:30px;font-size:12px}.msg{gap:8px}.body{max-width:calc(100% - 42px)}.bubble{padding:11px 13px;font-size:15px}#composer{padding:10px 10px max(12px,env(safe-area-inset-bottom))}#composer .box{gap:6px;padding:6px;border-radius:17px}#input{font-size:16px;padding:9px 7px}#send{min-width:54px;padding:10px 12px}#describe{padding:10px;font-size:12px}.hint{font-size:10px;gap:6px}#settingsDlg{padding:20px;border-radius:20px}#settingsDlg .row2{gap:10px}#settingsDlg .dlgFoot{bottom:-20px}.section-heading{flex-wrap:wrap}.modelChip{max-width:100%}}
  @media(max-width:360px){#composer .box{flex-wrap:wrap}#input{flex-basis:100%}#describe{margin-left:auto}#settingsDlg .row2{flex-direction:column;gap:0}.brand p{display:none}}
  @media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;animation:none!important;transition:none!important}}


  /* Restrained monochrome surfaces. */
  :root{--bg:#101010;--panel:#191919;--line:#343434;--text:#ededed;--dim:#a6a6a6;--me:#303030}
  body{background:#101010}
  header{background:#101010;border-color:#292929;justify-content:flex-end;padding-top:12px;padding-bottom:12px}
  #settingsBtn{background:#191919;border-color:#363636;border-radius:9px;color:#dedede}
  #settingsBtn:hover{background:#252525}
  button:focus-visible,input:focus-visible,textarea:focus-visible{outline-color:#c2c2c2}
  #chat{scrollbar-color:#484848 transparent}
  .name{color:#aaa}.avatar.me{background:#343434;color:#ddd}
  .bubble{background:#202020;border-color:#303030;box-shadow:none;border-radius:5px 13px 13px 13px}
  .msg.me .bubble{background:#303030;border-color:#424242;border-radius:13px 5px 13px 13px}
  #composer{background:linear-gradient(transparent,#101010 24%)}
  #composer .box{background:#1b1b1b;border-color:#3b3b3b;border-radius:14px;box-shadow:none}
  #composer .box:focus-within{border-color:#777;box-shadow:none}
  #input::placeholder{color:#929292}
  #send,#settingsDlg .primary{background:#e0e0e0;color:#161616;border-radius:9px}
  #send:hover{background:#fff}
  #describe{border-color:#444;color:#ccc;border-radius:9px}
  #describe:hover{background:#303030}
  .hint{color:#909090}
  .chip{background:#202020;border-color:#3a3a3a;color:#ddd}.chip:hover{background:#292929;border-color:#666}
  #settingsDlg{background:#191919;border-color:#404040;border-radius:15px;box-shadow:0 20px 70px #0008}
  #settingsDlg::backdrop{background:#000a;backdrop-filter:blur(3px)}
  #settingsDlg .ghost{background:#262626;border-color:#424242;border-radius:9px}
  #settingsDlg .ghost:hover{background:#333}
  #settingsDlg input{background:#101010;border-color:#3c3c3c;border-radius:8px}
  #settingsDlg input:focus{border-color:#777}
  #settingsDlg label,.section-caption{color:#c7c7c7}
  #settingsDlg .eff{background:#111;color:#aaa}
  #settingsDlg .dlgFoot{background:#191919}
  .modelChip{background:#242424;border-color:#444;color:#bbb}
  .modelChip.live{color:#ddd;border-color:#666}
  #toast{background:#262626;border-color:#444;color:#eee}
  @media(max-width:600px){header{padding-top:max(10px,env(safe-area-inset-top));padding-bottom:10px}#composer .box{border-radius:13px}#settingsDlg{border-radius:14px}}


  .settings-tabs{display:flex;gap:6px;background:#101010;padding:5px;border:1px solid #303030;border-radius:10px;margin:0 0 22px}
  .settings-tabs button{flex:1;border:0;border-radius:7px;background:transparent;color:#aaa;font:inherit;font-size:14px;padding:9px 12px;cursor:pointer}
  .settings-tabs button[aria-selected="true"]{background:#343434;color:#fff}
  .settings-tabs button:hover{color:#fff}
  #settingsDlg [role="tabpanel"][hidden]{display:none}
  #settingsDlg .section-heading{border:0;padding-top:0;margin-top:0}
  .settings-close{display:flex;justify-content:flex-end;border-top:1px solid #333;margin-top:18px;padding-top:14px}
  #settingsDlg .dlgFoot{position:static;padding:4px 0 0}
  #settingsDlg #panelMemory{min-height:170px}
  @media(max-width:600px){.memory-actions{flex-direction:column}.memory-actions button{text-align:left;padding:12px 14px}.settings-tabs{margin-bottom:18px}}

  .character-status{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);flex:none;background:var(--bg)}
  .character-status details{min-width:0;padding:8px 10px;background:#191919;border:1px solid #333;border-radius:9px}
  .character-status summary{cursor:pointer;list-style:none;min-height:44px}
  .character-status summary::-webkit-details-marker{display:none}
  .character-status summary:focus-visible{outline:2px solid #aaa;outline-offset:3px}
  .character-status strong{display:block;font-size:13px;font-weight:600;color:#ddd}
  .character-status .preview{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:12px;line-height:1.5;color:#aaa;overflow-wrap:anywhere}
  .character-status details[open] .preview{display:none}
  .character-status .full-status{font-size:12px;color:#bbb;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere;max-height:20vh;overflow-y:auto;margin-top:4px}
  @media(max-width:600px){.character-status{padding:8px;gap:6px}.character-status details{padding:7px}}
</style>
</head>
<body>
<header>

  <button id="settingsBtn" title="打开设置" aria-label="打开设置"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="3" fill="var(--panel)"/><circle cx="15" cy="17" r="3" fill="var(--panel)"/></svg><span>设置</span></button>
</header>
<section class="character-status" aria-label="三人当前状态">
  <details data-character="小婉"><summary><strong>小婉</strong><span class="preview">正在读取状态…</span></summary><div class="full-status">正在读取状态…</div></details>
  <details data-character="小研"><summary><strong>小研</strong><span class="preview">正在读取状态…</span></summary><div class="full-status">正在读取状态…</div></details>
  <details data-character="小柳"><summary><strong>小柳</strong><span class="preview">正在读取状态…</span></summary><div class="full-status">正在读取状态…</div></details>
</section>

<dialog id="settingsDlg" aria-labelledby="settingsTitle">
  <h2 id="settingsTitle">设置</h2>
  <div class="settings-tabs" role="tablist" aria-label="设置分类">
    <button type="button" id="tabModel" role="tab" aria-selected="true" aria-controls="panelModel" tabindex="0">模型连接</button>
    <button type="button" id="tabMemory" role="tab" aria-selected="false" aria-controls="panelMemory" tabindex="-1">对话记忆</button>
  </div>
  <section id="panelMemory" role="tabpanel" aria-labelledby="tabMemory" hidden>
  <p class="section-caption">对话与记忆</p>
  <div class="memory-actions">
    <button id="save" type="button" class="ghost">保存到记忆</button>
    <button id="clear" type="button" class="ghost danger">清除当前对话</button>
  </div>
  <p class="settings-note">保存对话供后续回忆；清除仅移除当前浏览器中的对话。</p>
  </section>
  <section id="panelModel" role="tabpanel" aria-labelledby="tabModel">
  <div class="section-heading"><h3>模型连接</h3><span id="modelChip" class="modelChip" title="当前生效模型">—</span></div>
  <div class="field">
    <label for="sBase">接口地址 base_url</label>
    <input id="sBase" placeholder="https://api.openai.com/v1 ／ http://127.0.0.1:11434/v1" />
  </div>
  <div class="field">
    <label for="sModel">模型名 model</label>
    <input id="sModel" placeholder="deepseek-chat ／ qwen2.5:14b ／ gpt-4o-mini" />
  </div>
  <div class="field">
    <label for="sKey">API Key<span id="sKeyHint" class="hintInline"></span></label>
    <input id="sKey" type="password" placeholder="留空表示不修改" autocomplete="off" />
  </div>
  <div class="row2">
    <div class="field">
      <label for="sTemp">temperature</label>
      <input id="sTemp" type="number" step="0.1" min="0" max="2" />
    </div>
    <div class="field">
      <label for="sTokens">max_tokens（留空=不限）</label>
      <input id="sTokens" type="number" step="50" min="0" placeholder="留空或 0 = 不限制" />
    </div>
  </div>
  <div class="eff" id="sEff"></div>
  <div class="status" id="sStatus"></div>
  <div class="dlgFoot">
    <button id="sTest" class="ghost">测试连接</button>
    <button id="sSave" class="primary">保存</button>
  </div>
  </section>
  <div class="settings-close"><button id="sClose" type="button" class="ghost">关闭</button></div>
</dialog>

<main id="chat" aria-label="聊天记录"></main>
<div id="toast" role="status" aria-live="polite"></div>

<div id="composer">
  <div id="suggest"></div>
  <div class="box">
    <textarea aria-label="输入消息" id="input" rows="1" placeholder="写下此刻想说的话…"></textarea>
    <button id="describe" title="帮你想接下来做什么，给三条可直接发送的描述">描述</button>
    <button id="send">发送</button>
  </div>
  <div class="hint">
    <span>对话存在本机浏览器里，刷新不丢</span>
    <span id="status"></span>
  </div>
</div>

<script>
const STORE_KEY = "companion-chat-v1";
const SAVED_KEY = "companion-chat-saved";
const NAMES = ["小婉", "小研", "小柳"];
const META = {
  "小婉": { cls: "wan", label: "婉" },
  "小研": { cls: "yan", label: "研" },
  "小柳": { cls: "liu", label: "柳" },
};

const chatEl = document.getElementById("chat");
const inputEl = document.getElementById("input");
const sendEl = document.getElementById("send");
const statusEl = document.getElementById("status");

let history = [];
let savedCount = 0;
let busy = false;

function load(){
  try{ history = JSON.parse(localStorage.getItem(STORE_KEY) || "[]"); }catch{ history = []; }
  savedCount = Math.min(parseInt(localStorage.getItem(SAVED_KEY) || "0", 10) || 0, history.length);
}
function persist(){
  localStorage.setItem(STORE_KEY, JSON.stringify(history.slice(-80)));
}

/* ---------- 渲染 ---------- */

function msgNode(who, text, isMe, streaming){
  const wrap = document.createElement("div");
  wrap.className = "msg" + (isMe ? " me" : "");

  const av = document.createElement("div");
  const meta = isMe ? { cls: "me", label: "你" } : (META[who] || { cls: "", label: "角" });
  av.className = "avatar " + meta.cls;
  av.textContent = meta.label;

  const body = document.createElement("div");
  body.className = "body";

  const name = document.createElement("div");
  name.className = "name";
  name.textContent = isMe ? "你" : who;

  const bubble = document.createElement("div");
  bubble.className = "bubble" + (streaming ? " cursor" : "");
  bubble.textContent = text;

  body.appendChild(name);
  body.appendChild(bubble);
  wrap.appendChild(av);
  wrap.appendChild(body);
  return wrap;
}

/** 同角色最多合并两段、约160字；长回复保留多个气泡。 */
function segments(text){
  const out = [];
  const lines = String(text).split("\n");
  for (const line of lines){
    const m = line.match(/^\s*(小婉|小研|小柳)\s*[：:]\s*(.*)$/);
    if (m){
      const previous = out[out.length - 1];
      if (previous && previous.who === m[1] && (previous.parts || 1) < 2
          && previous.text.length + m[2].length <= 160){
        previous.text += (previous.text.trim() ? "\n\n" : "") + m[2];
        previous.parts = (previous.parts || 1) + 1;
      } else {
        out.push({ who: m[1], text: m[2], parts: 1 });
      }
    } else if (out.length){
      const cur = out[out.length - 1];
      cur.text += (cur.text ? "\n" : "") + line;
    } else {
      out.push({ who: "角色", text: line });
    }
  }
  return out.map(s => ({ who: s.who, text: s.text.replace(/\n{3,}/g, "\n\n").trim() }))
            .filter(s => s.text.length && s.text !== s.who);
}

function renderGroup(group, text, streaming){
  group.innerHTML = "";
  const segs = segments(text);
  if (!segs.length){
    group.appendChild(msgNode("角色", "", false, true));
    return;
  }
  segs.forEach((s, i) => {
    const last = i === segs.length - 1;
    group.appendChild(msgNode(s.who, s.text, false, streaming && last));
  });
  chatEl.scrollTop = chatEl.scrollHeight;
}

function render(){
  chatEl.innerHTML = "";
  for (const m of history){
    if (m.role === "user"){
      chatEl.appendChild(msgNode("", m.content, true, false));
    } else {
      const g = document.createElement("div");
      g.className = "group";
      renderGroup(g, m.content, false);
      chatEl.appendChild(g);
    }
  }
  chatEl.scrollTop = chatEl.scrollHeight;
}

/* ---------- 发送（流式） ---------- */

async function send(){
  const text = inputEl.value.trim();
  if (!text || busy) return;
  busy = true; sendEl.disabled = true; describeEl.disabled = true;
  clearSuggest();
  inputEl.value = ""; inputEl.style.height = "auto";

  history.push({ role: "user", content: text });
  chatEl.appendChild(msgNode("", text, true, false));

  const group = document.createElement("div");
  group.className = "group";
  chatEl.appendChild(group);
  renderGroup(group, "", true);
  chatEl.scrollTop = chatEl.scrollHeight;

  let acc = "";
  try{
    const res = await fetch("/api/stream", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ messages: history })
    });
    if (!res.ok){
      const d = await res.json().catch(() => ({ error: "HTTP " + res.status }));
      group.innerHTML = "";
      group.appendChild(msgNode("", "出错：" + (d.error || "未知错误"), false, false))
           .querySelector(".bubble")?.classList.add("err");
      group.querySelector(".bubble")?.classList.add("err");
      statusEl.textContent = "请求失败";
      return;
    }

    const reader = res.body.getReader();
    const decoder = new TextDecoder("utf-8");
    let buf = "";

    while (true){
      const { value, done } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });

      let idx;
      while ((idx = buf.indexOf("\n\n")) >= 0){
        const raw = buf.slice(0, idx).trim();
        buf = buf.slice(idx + 2);
        if (!raw.startsWith("data:")) continue;
        let evt;
        try{ evt = JSON.parse(raw.slice(5).trim()); }catch{ continue; }

        if (evt.delta){ acc += evt.delta; renderGroup(group, acc, true); }
        else if (evt.status){ statusEl.textContent = evt.status; }
        else if (evt.retry){ acc = ""; renderGroup(group, "", true); statusEl.textContent = "连接断了，正在重试…"; }
        else if (evt.reset){ acc = ""; renderGroup(group, "", true); }
        else if (evt.error){
          group.innerHTML = "";
          const n = msgNode("", "出错：" + evt.error, false, false);
          n.querySelector(".bubble").classList.add("err");
          group.appendChild(n);
          statusEl.textContent = "请求失败";
        }
      }
    }

    acc = acc.trim();
    if (acc){
      history.push({ role: "assistant", content: acc });
      renderGroup(group, acc, false);
    } else {
      const n = msgNode("", "（这次没返回内容，再发一次试试）", false, false);
      n.querySelector(".bubble").classList.add("err");
      group.appendChild(n);
    }
    persist();
    refreshModel();
  }catch(err){
    group.innerHTML = "";
    const n = msgNode("", "网络错误：" + err.message, false, false);
    n.querySelector(".bubble").classList.add("err");
    group.appendChild(n);
  }finally{
    busy = false; sendEl.disabled = false; describeEl.disabled = false;
    inputEl.focus();
    chatEl.scrollTop = chatEl.scrollHeight;
  }
}

/* ---------- 描述：帮用户想下一步 ---------- */

const suggestEl = document.getElementById("suggest");
const describeEl = document.getElementById("describe");

function clearSuggest(){ suggestEl.innerHTML = ""; }

async function describe(){
  if (busy) return;
  if (!history.length){ statusEl.textContent = "先说句话再点描述"; return; }
  describeEl.disabled = true;
  statusEl.textContent = "在想接下来能做什么…";
  try{
    const res = await fetch("/api/describe", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ messages: history })
    });
    const d = await res.json();
    if (d.error){ statusEl.textContent = "失败：" + d.error; return; }
    clearSuggest();
    const opts = d.options || [];
    if (!opts.length){ statusEl.textContent = "没想出来，再点一次"; return; }
    opts.forEach((text, i) => {
      const b = document.createElement("button");
      b.className = "chip";
      const tag = document.createElement("span");
      tag.className = "tag";
      tag.textContent = String(i + 1);
      b.appendChild(tag);
      b.appendChild(document.createTextNode(text));
      b.addEventListener("click", ()=>{
        inputEl.value = text;
        inputEl.focus();
        inputEl.style.height = "auto";
        inputEl.style.height = Math.min(inputEl.scrollHeight, 180) + "px";
        clearSuggest();
        statusEl.textContent = "已填进输入框，可以改了再发";
      });
      suggestEl.appendChild(b);
    });
    statusEl.textContent = "选一条，点一下填进输入框";
  }catch(e){
    statusEl.textContent = "出错：" + e.message;
  }finally{
    describeEl.disabled = false;
  }
}

describeEl.addEventListener("click", describe);

sendEl.addEventListener("click", send);
inputEl.addEventListener("keydown", e=>{
  if (e.key === "Enter" && !e.shiftKey){ e.preventDefault(); send(); }
});
inputEl.addEventListener("input", ()=>{
  inputEl.style.height = "auto";
  inputEl.style.height = Math.min(inputEl.scrollHeight, 180) + "px";
});


/* ---------- 当前生效模型 ---------- */

const modelChip = document.getElementById("modelChip");
let modelTimer = null;

function renderCharacterStatus(scene){
  document.querySelectorAll("[data-character]").forEach(card=>{
    const value = scene && scene[card.dataset.character];
    const status = typeof value === "string" && value.trim() ? value.trim() : "暂无场景状态";
    card.querySelector(".preview").textContent = status;
    card.querySelector(".full-status").textContent = status;
  });
}

async function refreshModel(){
  try{
    const r = await fetch("/api/info");
    if (!r.ok) throw new Error("状态读取失败");
    const d = await r.json();
    renderCharacterStatus(d.scene_state);
    const name = d.model || "未配置";
    modelChip.textContent = name;
    modelChip.classList.toggle("live", !!d.has_key && name !== "(未配置)");
    modelChip.title = "当前生效模型：" + name + (d.has_key ? "" : "（没有读到 api_key）");
  }catch(e){
    modelChip.textContent = "离线";
    modelChip.classList.remove("live");
    document.querySelectorAll("[data-character] .preview").forEach(el=>{
      if(el.textContent === "正在读取状态…") el.textContent = "状态暂时无法读取";
    });
  }
}

refreshModel();
modelTimer = setInterval(refreshModel, 15000);
document.addEventListener("visibilitychange", ()=>{ if (!document.hidden) refreshModel(); });

/* ---------- 设置 ---------- */


const settingsTabs = [...document.querySelectorAll('.settings-tabs [role="tab"]')];
function activateSettingsTab(tab, focus = false){
  for (const item of settingsTabs){
    const active = item === tab;
    item.setAttribute('aria-selected', String(active));
    item.tabIndex = active ? 0 : -1;
    document.getElementById(item.getAttribute('aria-controls')).hidden = !active;
  }
  if (focus) tab.focus();
}
settingsTabs.forEach((tab, index) => {
  tab.addEventListener('click', () => activateSettingsTab(tab));
  tab.addEventListener('keydown', event => {
    let next;
    if (event.key === 'ArrowRight') next = (index + 1) % settingsTabs.length;
    if (event.key === 'ArrowLeft') next = (index + settingsTabs.length - 1) % settingsTabs.length;
    if (event.key === 'Home') next = 0;
    if (event.key === 'End') next = settingsTabs.length - 1;
    if (next !== undefined){event.preventDefault();activateSettingsTab(settingsTabs[next], true);}
  });
});

const dlg = document.getElementById("settingsDlg");
const sBase = document.getElementById("sBase");
const sModel = document.getElementById("sModel");
const sKey = document.getElementById("sKey");
const sTemp = document.getElementById("sTemp");
const sTokens = document.getElementById("sTokens");
const sEff = document.getElementById("sEff");
const sKeyHint = document.getElementById("sKeyHint");

let settingsLoading = false;
async function openSettings(){
  if (settingsLoading) return;
  settingsLoading = true;
  sKey.value = "";
  sEff.textContent = "正在读取配置…";
  dlgStatus("", "");
  if (!dlg.open) dlg.showModal();
  const controls = [sBase, sModel, sKey, sTemp, sTokens,
    document.getElementById("sSave"), document.getElementById("sTest")];
  controls.forEach(control => control.disabled = true);
  try{
    const r = await fetch("/api/settings", {signal: AbortSignal.timeout(20000)});
    if (!r.ok) throw new Error("HTTP " + r.status);
    const d = await r.json();
    sBase.value = d.base_url || "";
    sModel.value = d.model || "";
    sKey.value = "";
    sTemp.value = d.temperature ?? 1.0;
    sTokens.value = (d.max_tokens === null || d.max_tokens === undefined) ? "" : d.max_tokens;
    sKeyHint.textContent = d.api_key_masked ? "当前：" + d.api_key_masked : "当前：未设置";
    const eff = d.effective || {};
    sEff.textContent =
      "实际生效\n" +
      "model：" + (eff.model || "（空，将用 .env）") + "\n" +
      "base_url：" + (eff.base_url || "（空，将用 .env）") + "\n" +
      "key：" + (eff.has_key ? "已读到" : "没有");
  }catch(e){
    sEff.textContent = "配置加载失败，请关闭后重新打开：" + e.message;
  }finally{
    settingsLoading = false;
    controls.forEach(control => control.disabled = false);
  }
}

function settingsDraft(){
  const tokenRaw = sTokens.value.trim();
  const body = {
    base_url: sBase.value.trim(),
    model: sModel.value.trim(),
    temperature: Number(sTemp.value),
    max_tokens: tokenRaw === "" ? 0 : Number(tokenRaw),
  };
  if (sKey.value.trim()) body.api_key = sKey.value.trim();
  return body;
}

async function saveSettings(){
  const body = settingsDraft();
  try{
    const r = await fetch("/api/settings", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body)
    });
    const d = await r.json();
    if (!r.ok || d.error){ dlgStatus("保存失败：" + (d.error || JSON.stringify(d.detail)), "err"); return; }
    const eff = d.effective || {};
    sKeyHint.textContent = d.api_key_masked ? "当前：" + d.api_key_masked : "当前：未设置";
    sEff.textContent = "实际生效\nmodel：" + (eff.model || "未设置") +
      "\nbase_url：" + (eff.base_url || "未设置") + "\nkey：" + (eff.has_key ? "已读到" : "没有");
    sKey.value = "";
    dlgStatus("已保存 · 现在是 " + (d.effective && d.effective.model ? d.effective.model : d.model), "ok");
    toast("设置已保存，下一句就按新模型走", "ok");
    refreshModel();
  }catch(e){ toast("保存出错：" + e.message, "error"); }
}

function dlgStatus(msg, kind){
  const el = document.getElementById("sStatus");
  el.className = "status " + (kind || "");
  el.textContent = msg;
}

async function testModel(){
  const btn = document.getElementById("sTest");
  btn.disabled = true;
  dlgStatus("正在测试输入框中的配置（尚未保存）…", "wait");
  try{
    const r = await fetch("/api/test", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(settingsDraft())
    });
    const d = await r.json();
    if (d.error){
      dlgStatus("连不上：\n" + d.error, "err");
      return;
    }
    dlgStatus("连接正常 · " + d.model + "\n回：" + (d.reply || "（空）"), "ok");
  }catch(e){
    dlgStatus("测试出错：" + e.message, "err");
  }finally{
    btn.disabled = false;
  }
}

document.getElementById("settingsBtn").addEventListener("click", openSettings);
document.getElementById("sSave").addEventListener("click", saveSettings);
document.getElementById("sTest").addEventListener("click", testModel);
document.getElementById("sClose").addEventListener("click", ()=> dlg.close());

/* ---------- 保存到记忆包 ---------- */

const saveEl = document.getElementById("save");

saveEl.addEventListener("click", async ()=>{
  if (saveEl.disabled) return;
  const fresh = history.slice(savedCount);
  if (!fresh.length){
    toast("没有新内容要保存（清除后或已存过）", "warn");
    return;
  }

  saveEl.disabled = true;
  const oldText = saveEl.textContent;
  saveEl.textContent = "保存中…";
  toast("正在写进记忆包…", "info");

  try{
    const res = await fetch("/api/save", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ messages: fresh })
    });
    const d = await res.json();

    if (d.error){
      toast("保存失败：" + d.error, "error");
      saveEl.textContent = "保存失败";
      setTimeout(()=>{ saveEl.textContent = oldText; saveEl.disabled = false; }, 1800);
      return;
    }

    savedCount = history.length;
    localStorage.setItem(SAVED_KEY, String(savedCount));
    saveEl.textContent = "已保存 ✓";
    toast(`已保存 ${d.saved} 条`, "ok");
    setTimeout(()=>{ saveEl.textContent = oldText; saveEl.disabled = false; }, 1600);
  }catch(e){
    toast("保存出错：" + e.message, "error");
    saveEl.textContent = "保存出错";
    setTimeout(()=>{ saveEl.textContent = oldText; saveEl.disabled = false; }, 1800);
  }
});

/* ---------- 提示条 ---------- */

const toastEl = document.getElementById("toast");
let toastTimer = null;

function toast(msg, type){
  toastEl.textContent = msg;
  toastEl.className = "show " + (type || "info");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{ toastEl.className = ""; }, type === "error" ? 4600 : 2600);
}

/* ---------- 清除 ---------- */

document.getElementById("clear").addEventListener("click", ()=>{
  if (!confirm("清除当前对话？记忆包里已经保存的内容不受影响。")) return;
  history = []; savedCount = 0;
  localStorage.removeItem(STORE_KEY);
  localStorage.setItem(SAVED_KEY, "0");
  render();
  statusEl.textContent = "";
  dlg.close();
  inputEl.focus();
  toast("当前对话已清除，记忆包没动", "warn");
});

load(); render();
inputEl.focus();
</script>
</body>
</html>
